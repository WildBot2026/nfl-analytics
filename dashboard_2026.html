  "NFC South": ["ATL", "CAR", "NO", "TB"],
  "NFC West": ["ARI", "LAR", "SF", "SEA"]

// Round label
function rdLabel(r){
  if(r<=1) return '<span class="dr r1">R1</span>';
  if(r<=2) return '<span class="dr r2">R2</span>';
  if(r<=3) return '<span class="dr r3">R3</span>';
  return '<span class="dr r4">R'+r+'</span>';
}

function teamInfo(t){
  const team = teams.find(tx => tx.id === t);
  return team ? team : { id: t, name: t, city: "", conf: "", div: "", color: "#888" };
}

function showTab(tab){
  document.querySelectorAll('[id^="tb-"]').forEach(b => {b.style.background = '#16162a'; b.style.borderColor = '#333';});
  const btn = document.getElementById('tb-'+tab);
  if(btn) {btn.style.background = '#222'; btn.style.borderColor = '#4a9eff';}
  
  const an = document.getElementById('an');
  let html = '';
  
  if(tab === 'overview') html = renderOverview();
  else if(tab === 'draft') html = renderDraft();
  else if(tab === 'udfa') html = renderUDFA();
  else if(tab === 'schedule') html = renderSchedule();
  else if(tab === 'betting') { showBettingTab(); return; }
  else if(tab === 'rosters') html = renderRosters();
  
  an.innerHTML = html;
  an.style.display = 'block';
}

function renderOverview(){
  let h = '<div class="gd">';
  
  // Season info card
  h += '<div class="ct fw"><h3>📅 Fechas Clave 2026</h3><table>';
  season2026.specialDates.forEach(d => {
    h += '<tr><td>📌 ' + d + '</td></tr>';
  });

  // Preseason
  h += '<div class="ct"><h3>🏈 Preseason</h3>';
  season2026.preseason.forEach(g => {
    const away = teamInfo(g.away);

    const dateStr = dateObj.toLocaleDateString('es-MX', { month: 'short', day: 'numeric' });

    h += '</div>';
  });

  h += '<div class="ct"><h3>🌍 International Games</h3>';

    const away = teamInfo(g.away);
    const home = teamInfo(g.home);
    const dateObj = new Date(g.date + 'T00:00:00');
    const dateStr = dateObj.toLocaleDateString('es-MX', { weekday: 'short', month: 'short', day: 'numeric' });

  h += '<div class="ct"><h3>🏆 Super Bowl LXI</h3>';
  h += '<div style="text-align:center;padding:8px">';
  h += '<div style="font-size:1.5rem;margin:4px 0">🏆</div>';
  h += '<div style="font-size:.95rem"><b>14 de Febrero, 2027</b></div>';
  h += '<div style="font-size:.85rem;color:#ffd700">SoFi Stadium · Inglewood, CA</div>';
  h += '<div style="font-size:.7rem;color:#888">Visitante: TBD vs Local: TBD</div>';

  for(const [div, tlist] of Object.entries(divTeams)){

function renderDraft(){
  let h = '<div class="ct fw"><h3>📋 Draft 2026 — Todas las selecciones</h3>';
  h += '<div class="sm">257 picks · 7 rondas · ' + Object.keys(draft2026).length + ' equipos</div></div>';
  
  // By division
  for(const [div, tlist] of Object.entries(divTeams)){
    h += '<div class="ct fw"><h3>' + div + '</h3>';
    tlist.forEach(t => {
      const info = teamInfo(t);
      const picks = draft2026[t] || [];
      if(picks.length === 0) return;
      h += '<div style="margin:6px 0;padding:4px;background:#1a1a2e;border-radius:4px">';
      h += '<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">';
      h += '<img src="'+logoUrl(t)+'" width="18" height="18" style="border-radius:2px">';
      h += '<b style="font-size:.85rem;color:#fff">' + info.name + '</b>';
      h += '<span style="color:#888;font-size:.7rem">(' + picks.length + ' picks)</span>';
      h += '</div>';
      h += '<table><tr><th>Rd</th><th>Pick</th><th>Jugador</th><th>Pos</th><th>Universidad</th></tr>';
      picks.forEach(p => {
        h += '<tr><td>' + rdLabel(p.round) + '</td><td style="color:#888">#' + p.pick + '</td>';
        h += '<td style="font-weight:600;color:#fff">' + p.name + '</td>';
        h += '<td>' + p.pos + '</td><td style="color:#999">' + p.college + '</td></tr>';
      });
      h += '</table>';
      h += '</div>';
    });
    h += '</div>';
  }
  
  return h;
}

function renderSchedule(){
  const dayName = d => { const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']; return days[d.getDay()]; };
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const fmtDate = ds => { const d=new Date(ds+'T12:00:00'); return dayName(d)+' '+d.getDate()+' '+months[d.getMonth()]; };
  const weekLabels = {1:'Semana 1 · Sep 9-15',2:'Semana 2 · Sep 17-22',3:'Semana 3 · Sep 27-28',
    4:'Semana 4 · Oct 1-5',5:'Semana 5 · Oct 8-12',6:'Semana 6 · Oct 15-19',
    7:'Semana 7 · Oct 22-26',8:'Semana 8 · Nov 1-2',9:'Semana 9 · Nov 5-9',
    10:'Semana 10 · Nov 12-16',11:'Semana 11 · Nov 19-23',12:'Semana 12 · Nov 26-30',
    13:'Semana 13 · Dic 3-7',14:'Semana 14 · Dic 10-14',15:'Semana 15 · Dic 17-21',
    16:'Semana 16 · Dic 24-28',17:'Semana 17 · Dic 31-Ene 4',18:'Semana 18 · Ene 10'};

  let h = '<div class="ct fw"><h3>📅 Calendario NFL 2026</h3>';
  h += '<div class="sm">' + Object.keys(weeklyGames).length + ' semanas · ~270 juegos · Publicado 14 Mayo 2026</div></div>';
  
  // International games
  h += '<div class="ct fw"><h3>🌍 Juegos Internacionales</h3><table>';
  season2026.international.forEach(g => {
    const tAway = teamInfo(g.away); const tHome = teamInfo(g.home);
    h += '<tr><td style="color:#4a9eff;font-size:.78rem">S' + g.week + '</td><td style="font-size:.78rem">' + tAway.name + ' @ ' + tHome.name + '</td><td style="color:#888;font-size:.7rem">' + g.venue + '</td><td style="font-size:.7rem">' + g.label + '</td></tr>';
  });
  h += '</table></div>';
  
  // ALL WEEKS in vertical list
  const wks = Object.keys(weeklyGames).map(Number).sort((a,b)=>a-b);
  
  wks.forEach(w => {
    const gms = weeklyGames[w] || [];
    h += '<div class="ct fw" style="margin-top:6px">';
    h += '<h3>📆 ' + weekLabels[w] + ' <span style="color:#888;font-size:.7rem;font-weight:normal">(' + gms.length + ' juegos)</span></h3>';
    
    gms.forEach(g => {
      const a = teamInfo(g.away);
      const hm = teamInfo(g.home);
      const dateStr = fmtDate(g.date);
      let noteHtml = '';
      if(g.note) {
        let noteColor = '#ffd700';
        if(g.note.includes('Thanksgiving')) noteColor = '#ff6b35';
        if(g.note.includes('Christmas')) noteColor = '#ff4444';
        if(g.note.includes('Kickoff')) noteColor = '#ffd700';
        noteHtml = '<span style="font-size:.65rem;color:'+noteColor+';background:rgba(255,215,0,0.1);padding:1px 5px;border-radius:3px;margin-left:4px;font-weight:600">' + g.note + '</span>';
      }
      h += '<div style="margin:3px 0;padding:4px 8px;background:#1a1a2e;border-radius:4px;display:flex;align-items:center;gap:5px;border-left:3px solid #4a9eff">';
      h += '<img src="'+logoUrl(g.away)+'" width="18" height="18" style="border-radius:2px">';
      h += '<div style="flex:1;font-size:.8rem"><b>' + a.name + '</b> <span style="color:#888;font-weight:normal">@</span> <b>' + hm.name + '</b></div>';
      h += '<img src="'+logoUrl(g.home)+'" width="18" height="18" style="border-radius:2px">';
      h += '<div style="text-align:right;font-size:.68rem;white-space:nowrap"><span style="color:#999">' + dateStr + '</span>' + noteHtml + '</div>';
      h += '</div>';
    });
    
    h += '</div>';
  });
  
  return h;
}

function renderRosters(){
  let h = '<div class="ct fw"><h3>🏈 Rosters Clave — Adiciones Post-Draft 2026</h3>';
  h += '<div class="sm">Equipos con movimientos destacados del draft. Depth charts completos se actualizan en preseason.</div></div>';
  
  for(const [team, info] of Object.entries(rosterNotes)){
    const tInfo = teamInfo(team);
    h += '<div class="ct"><div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">';
    h += '<img src="'+logoUrl(team)+'" width="18" height="18" style="border-radius:2px">';
    h += '<h3 style="margin:0;font-size:.9rem">' + tInfo.name + '</h3>';
    h += '</div>';
    if(info.qb) h += '<div style="font-size:.78rem;margin:2px 0"><span style="color:#4a9eff">QB:</span> ' + info.qb.join(', ') + '</div>';
    if(info.rb) h += '<div style="font-size:.78rem;margin:2px 0"><span style="color:#4a9eff">RB:</span> ' + info.rb.join(', ') + '</div>';
    if(info.wr) h += '<div style="font-size:.78rem;margin:2px 0"><span style="color:#4a9eff">WR:</span> ' + info.wr.join(', ') + '</div>';
    if(info.cb) h += '<div style="font-size:.78rem;margin:2px 0"><span style="color:#4a9eff">CB:</span> ' + info.cb.join(', ') + '</div>';
    if(info.s) h += '<div style="font-size:.78rem;margin:2px 0"><span style="color:#4a9eff">S:</span> ' + info.s.join(', ') + '</div>';
    if(info.lb) h += '<div style="font-size:.78rem;margin:2px 0"><span style="color:#4a9eff">LB:</span> ' + info.lb.join(', ') + '</div>';
    if(info.edge) h += '<div style="font-size:.78rem;margin:2px 0"><span style="color:#4a9eff">EDGE:</span> ' + info.edge.join(', ') + '</div>';
    if(info.ot) h += '<div style="font-size:.78rem;margin:2px 0"><span style="color:#4a9eff">OT:</span> ' + info.ot.join(', ') + '</div>';
    if(info.note) h += '<div style="font-size:.7rem;color:#888;margin-top:3px;padding:2px 4px;background:#0d0d1a;border-radius:2px">💬 ' + info.note + '</div>';
    h += '</div>';
  }
  
  return h;
}
