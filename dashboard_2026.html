// Round label
function rdLabel(r){
  if(r<=1) return '<span class="dr r1">R1</span>';
  if(r<=2) return '<span class="dr r2">R2</span>';
  if(r<=3) return '<span class="dr r3">R3</span>';
  return '<span class="dr r4">R'+r+'</span>';
}

function teamInfo(t){
  const team = teams.find(tx => tx.id === t);
  return team ? team : { id: t, name: t, city: "", conf: "", div: "", color: "#888" };
}

function showTab(tab){
  document.querySelectorAll('[id^="tb-"]').forEach(b => b.style.background = '#16162a');
  const btn = document.getElementById('tb-'+tab);
  if(btn) btn.style.background = '#222';
  
  const an = document.getElementById('an');
  let html = '';
  
  if(tab === 'overview') html = renderOverview();
  else if(tab === 'draft') html = renderDraft();
  else if(tab === 'udfa') html = renderUDFA();
  else if(tab === 'schedule') html = renderSchedule();
  else if(tab === 'rosters') html = renderRosters();
  
  an.innerHTML = html;
  an.style.display = 'block';
}

function renderWeekGames(){
  const el = document.getElementById('weekGamesContainer');
  if(!el) return;
  const sel = document.getElementById('wkSel');
  const w = parseInt(sel.value);
  const gms = weeklyGames[w] || [];
  const dayName = d => { const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']; return days[d.getDay()]; };
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const fmtDate = ds => { const d=new Date(ds+'T12:00:00'); return dayName(d)+' '+d.getDate()+' '+months[d.getMonth()]; };
  
  let h = '<h3 style="margin:6px 0;font-size:1rem;color:#ffd700">Semana ' + w + ' — ' + gms.length + ' juegos</h3>';
  
  gms.forEach(g => {
    const a = teamInfo(g.away);
    const hm = teamInfo(g.home);
    const dateStr = fmtDate(g.date);
    let noteHtml = '';
    if(g.note) noteHtml = '<span style="font-size:.65rem;color:#ffd700;background:#332200;padding:1px 5px;border-radius:3px;margin-left:4px">' + g.note + '</span>';
    h += '<div style="margin:4px 0;padding:5px 8px;background:#1a1a2e;border-radius:4px;display:flex;align-items:center;gap:5px;border-left:3px solid #4a9eff">';
    h += '<img src="'+logoUrl(g.away)+'" width="20" height="20" style="border-radius:2px">';
    h += '<div style="flex:1;font-size:.82rem"><b>' + a.name + '</b> <span style="color:#888">@</span> <b>' + hm.name + '</b></div>';
    h += '<img src="'+logoUrl(g.home)+'" width="20" height="20" style="border-radius:2px">';
    h += '<div style="text-align:right;font-size:.7rem"><span style="color:#999">' + dateStr + '</span>' + noteHtml + '</div>';
    h += '</div>';
  });
  
  el.innerHTML = h;
}
