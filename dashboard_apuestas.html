<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d0d1a;color:#ddd;min-height:100vh;font-size:1rem}
.w{max-width:1200px;margin:0 auto;padding:12px}
h1{font-size:1.3rem;color:#fff;margin-bottom:2px}
.sub{color:#888;font-size:.8rem;margin-bottom:8px}
.ctrls{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.ctrls select{padding:6px 12px;background:#16162a;color:#ddd;border:1px solid #333;border-radius:5px;font-size:.9rem}
.ctrls button{background:#16162a;border:1px solid #333;color:#ddd;padding:6px 14px;border-radius:5px;cursor:pointer;font-size:.85rem}
.ctrls button:hover{background:#222;border-color:#4a9eff}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}
@media(max-width:600px){.gd{grid-template-columns:1fr}}
.gc{background:#16162a;border:1px solid #28283e;border-radius:6px;padding:10px;cursor:pointer;transition:all .15s}
.gc:hover{border-color:#4a9eff;background:#1b1b30}
.gc .vs{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.gc .vs img{width:24px;height:24px;border-radius:3px}
.gc .vs .nam{flex:1;font-size:.85rem}
.gc .vs .nam b{color:#fff}
.gc .info{display:flex;justify-content:space-between;color:#888;font-size:.75rem;margin-bottom:4px}
.gc .odds{display:flex;gap:4px;flex-wrap:wrap}
.odd{padding:2px 6px;border-radius:3px;font-size:.72rem;font-weight:600;background:#0d0d1a;border:1px solid #333}
.odd.ml{color:#4ade80;border-color:#4ade8030}
.odd.ats{color:#ffd700;border-color:#ffd70030}
.odd.ou{color:#4a9eff;border-color:#4a9eff30}
.odd.lock{color:#ff6b35;border-color:#ff6b3530}
#an{display:none;animation:fi .3s}
#an.show{display:block}
@keyframes fi{from{opacity:0}to{opacity:1}}
.agd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:700px){.agd{grid-template-columns:1fr}}
.ct{background:#16162a;border:1px solid #28283e;border-radius:6px;padding:10px}
.ct.fw{grid-column:1/-1}
.ct h3{font-size:.9rem;color:#fff;margin-bottom:6px}
.ct .vl{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1a1a2e;font-size:.8rem}
.ct .vl .lb{color:#888}
.ct .vl .rv{color:#ddd;font-weight:600}
.ct .vl .g{color:#4ade80}
.bar{height:8px;border-radius:4px;margin:4px 0;background:#0d0d1a;overflow:hidden}
.bar-f{height:100%;border-radius:4px;transition:width .5s}
.bar-f.g{background:linear-gradient(90deg,#4ade80,#22c55e)}
.bar-f.b{background:linear-gradient(90deg,#4a9eff,#3b82f6)}
.bar-f.y{background:linear-gradient(90deg,#ffd700,#f59e0b)}
table{width:100%;border-collapse:collapse;font-size:.78rem}
td,th{padding:3px 5px;border-bottom:1px solid #28283e;text-align:left}
th{color:#4a9eff;font-weight:600}
</style>
